#
# /etc/rawpanel/rawpanel.conf: rawpanel defaults
#

panel = {
  font = "monospace:size=10";
  position = "top";
  height = 24;
  padding = 6;
  item_spacing = 4;
  section_spacing = 10;
  cell_margin = 4;
  indicator_size = 2;
  tags = "occupied";

  colors = {
    normal   = { border = "#444444"; foreground = "#bbbbbb"; background = "#222222"; };
    selected = { border = "#005577"; foreground = "#eeeeee"; background = "#005577"; };
    floating = { border = "#d79921"; foreground = "#eeeeee"; background = "#3c3836"; };
    urgent   = { border = "#ff0000"; foreground = "#ffffff"; background = "#770000"; };
    error    = { border = "#cc241d"; foreground = "#ffffff"; background = "#770000"; };
  };
};

systray = {
  enabled = true;
  spacing = 4;
  icon_size = 20;
};

status = {
  enabled = true;
  separator = "·";
  sources = {
    clock = { provider = "clock"; format = "%a %b %d %H:%M"; period_ms = 30000; };
  };
};

buttons = ();
